[program:php-fpm83]
command=/opt/app/php83/bin/php-fpm83 -F -p /opt/local/php83 -y /opt/local/php83/php-fpm.conf -c /opt/local/php83
environment=PHP_INI_SCAN_DIR="/opt/local/php83/conf.d"
stdout_logfile=/opt/local/supervisor/log/php-fpm83-out.log
stdout_logfile_maxbytes=1MB
stderr_logfile=/opt/local/supervisor/log/php-fpm83-err.log
stderr_logfile_maxbytes=1MB
